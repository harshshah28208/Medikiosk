version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk_dev_2026
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
